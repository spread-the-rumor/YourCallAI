name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:        # manual re-deploy without bumping version

jobs:
  release:
    strategy:
      # Windows and macOS are independent builds publishing to the same draft. Without this, one
      # platform failing CANCELS the other mid-publish - which is exactly what happened on v2.3.0:
      # the mac ffmpeg build failed and killed a perfectly good Windows job during its upload.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: macos-15 # macos-14 was retired: jobs were cancelled with "configuration not supported"
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Fail fast on a missing secret: an empty value is baked in as '' without any error, and an
      # installer with no APP_PROXY_TOKEN gets 401 from every proxy route (AI, transcription, Slack).
      - name: Check build secrets
        shell: bash
        run: |
          missing=""
          for v in APP_PROXY_TOKEN SUPABASE_URL SUPABASE_ANON_KEY SLACK_CLIENT_ID ASANA_CLIENT_ID; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then echo "::error::Missing build secrets:$missing"; exit 1; fi
        env:
          APP_PROXY_TOKEN: ${{ secrets.APP_PROXY_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SLACK_CLIENT_ID: ${{ secrets.SLACK_CLIENT_ID }}
          ASANA_CLIENT_ID: ${{ secrets.ASANA_CLIENT_ID }}

      - name: Build Windows name agent
        if: runner.os == 'Windows'
        run: pwsh agents/windows/build.ps1

      # The installer must never ship without the agent (names, native audio capture, detection).
      - name: Check Windows agent binary
        if: runner.os == 'Windows'
        shell: bash
        run: test -s agents/dist/YourCallAgent.exe || { echo "::error::agents/dist/YourCallAgent.exe missing"; exit 1; }

      - name: Build macOS name agent
        if: runner.os == 'macOS'
        run: sh agents/macos/build.sh

      # Bundled ffmpeg for video normalization (§5). Keyed off the runner's platform/arch, so
      # each job provisions its own pinned build. Fails the job if it cannot: shipping an
      # installer without ffmpeg silently degrades every recording to an unseekable capture file.
      #
      # macOS COMPILES ffmpeg (no LGPL prebuilt exists - see scripts/fetch-ffmpeg.mjs), which
      # costs several minutes. The cache makes that a once-per-pin cost rather than a
      # once-per-release one; the key covers the script, so changing the pin rebuilds. On a hit
      # the fetch step still runs and re-verifies the binary, so a bad cache entry cannot ship.
      - name: Cache bundled ffmpeg
        uses: actions/cache@v4
        with:
          path: vendor/ffmpeg
          key: ffmpeg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/fetch-ffmpeg.mjs') }}

      - name: Fetch ffmpeg
        run: node scripts/fetch-ffmpeg.mjs
        env:
          CI: 'true'

      - run: npm ci

      - name: Self-check tests
        run: npm test

      # Both jobs publish to the same draft GitHub Release; publish the draft to go live.
      - name: Publish
        run: npm run publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERCEL_BACKEND_URL: ${{ secrets.VERCEL_BACKEND_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          # Baked into the client build (public client id + shipped proxy gate token).
          SLACK_CLIENT_ID: ${{ secrets.SLACK_CLIENT_ID }}
          ASANA_CLIENT_ID: ${{ secrets.ASANA_CLIENT_ID }}
          APP_PROXY_TOKEN: ${{ secrets.APP_PROXY_TOKEN }}

  # After the installers: the API and the client it serves go live together, and a failed build
  # no longer leaves a new backend in front of an old app (or the reverse).
  deploy-api:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy /api to Vercel (production)
        run: |
          npm i -g vercel@latest
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel deploy --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
