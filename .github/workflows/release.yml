name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:        # manual re-deploy without bumping version

jobs:
  release:
    strategy:
      matrix:
        include:
          - os: windows-latest
          - os: macos-14
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build Windows name agent
        if: runner.os == 'Windows'
        run: pwsh agents/windows/build.ps1

      - name: Build macOS name agent
        if: runner.os == 'macOS'
        run: sh agents/macos/build.sh

      # Bundled ffmpeg for video normalization (§5). Keyed off the runner's platform/arch, so
      # each job provisions its own pinned build. Fails the job if it cannot: shipping an
      # installer without ffmpeg silently degrades every recording to an unseekable capture file.
      #
      # macOS COMPILES ffmpeg (no LGPL prebuilt exists - see scripts/fetch-ffmpeg.mjs), which
      # costs several minutes. The cache makes that a once-per-pin cost rather than a
      # once-per-release one; the key covers the script, so changing the pin rebuilds. On a hit
      # the fetch step still runs and re-verifies the binary, so a bad cache entry cannot ship.
      - name: Cache bundled ffmpeg
        uses: actions/cache@v4
        with:
          path: vendor/ffmpeg
          key: ffmpeg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/fetch-ffmpeg.mjs') }}

      - name: Fetch ffmpeg
        run: node scripts/fetch-ffmpeg.mjs
        env:
          CI: 'true'

      - run: npm ci

      # Both jobs publish to the same draft GitHub Release; publish the draft to go live.
      - name: Publish
        run: npm run publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERCEL_BACKEND_URL: ${{ secrets.VERCEL_BACKEND_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          # Baked into the client build (public client id + shipped proxy gate token).
          SLACK_CLIENT_ID: ${{ secrets.SLACK_CLIENT_ID }}
          ASANA_CLIENT_ID: ${{ secrets.ASANA_CLIENT_ID }}
          APP_PROXY_TOKEN: ${{ secrets.APP_PROXY_TOKEN }}

  deploy-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy /api to Vercel (production)
        run: |
          npm i -g vercel@latest
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel deploy --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
